<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CrowdSafe AI - Google Drive & Docs Auto API Key Sync</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel Standalone สำหรับแปลง JSX บนเบราว์เซอร์ -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // ตัวอย่างโซนจำลองในงานคอนเสิร์ต
    const INITIAL_ZONES = [
      {
        id: 'zone-a',
        name: 'Zone A - หน้าเวทีหลัก (Main Stage Front)',
        maxCapacity: 500,
        currentCount: 435,
        flowRate: 30, // คนต่อนาที
        riskLevel: 'CRITICAL',
        description: 'พื้นที่หน้าเวทีหลัก มีการแสดงสดของศิลปินเฮดไลน์เนอร์',
        coordinates: { x: '35%', y: '45%' }
      },
      {
        id: 'zone-b',
        name: 'Zone B - ลานคอนเสิร์ตกลาง (General Admission)',
        maxCapacity: 1200,
        currentCount: 810,
        flowRate: 20,
        riskLevel: 'WARNING',
        description: 'พื้นที่ยืนชมคอนเสิร์ตตรงกลางทั่วไป',
        coordinates: { x: '55%', y: '60%' }
      },
      {
        id: 'zone-c',
        name: 'Zone C - ซุ้มอาหารและเครื่องดื่ม (F&B Area)',
        maxCapacity: 300,
        currentCount: 125,
        flowRate: -2, 
        riskLevel: 'NORMAL',
        description: 'พื้นที่จำหน่ายอาหาร เครื่องดื่ม และของที่ระลึก',
        coordinates: { x: '20%', y: '80%' }
      },
      {
        id: 'zone-d',
        name: 'Zone D - ทางเข้างานหลัก & จุดสแกนตั๋ว (Main Entrance)',
        maxCapacity: 400,
        currentCount: 340,
        flowRate: 40,
        riskLevel: 'WARNING',
        description: 'จุดลงทะเบียน ตรวจกระเป๋า และสแกนคิวอาร์โค้ดทางเข้า',
        coordinates: { x: '80%', y: '85%' }
      }
    ];

    function App() {
      const [zones, setZones] = useState(INITIAL_ZONES);
      const [selectedZone, setSelectedZone] = useState(INITIAL_ZONES[0]);
      const [googleDriveUrl, setGoogleDriveUrl] = useState('');
      const [apiKey, setApiKey] = useState('');
      const [apiKeySource, setApiKeySource] = useState('drive'); // 'drive' หรือ 'manual'
      const [isFetchingKey, setIsFetchingKey] = useState(false);
      const [fetchSuccess, setFetchSuccess] = useState(null);
      const [showKeyInput, setShowKeyInput] = useState(true);
      const [isSimulationRunning, setIsSimulationRunning] = useState(true);
      const [aiSuggestions, setAiSuggestions] = useState({});
      const [isLoadingAi, setIsLoadingAi] = useState(false);
      const [errorMessage, setErrorMessage] = useState('');
      
      const [logs, setLogs] = useState([
        { time: '13:00:00', message: 'ระบบตรวจจับและระบบจำลองกล้องพร้อมทำงาน', type: 'info' },
        { time: '13:02:15', message: 'พร้อมสำหรับการเชื่อมต่อ Google Drive / Doc Auto Sync', type: 'info' }
      ]);

      const [chartData, setChartData] = useState([410, 415, 422, 430, 428, 435]);

      // ฟังก์ชันสกัดเอา File ID หรือ Document ID จาก URL
      const extractDriveFileId = (input) => {
        if (!input) return '';
        const trimmed = input.trim();
        
        const docMatch = trimmed.match(/\/document\/d\/([a-zA-Z0-9-_]+)/);
        if (docMatch && docMatch[1]) return docMatch[1];

        const fileMatch = trimmed.match(/\/file\/d\/([a-zA-Z0-9-_]+)/);
        if (fileMatch && fileMatch[1]) return fileMatch[1];

        const idParamMatch = trimmed.match(/[?&]id=([a-zA-Z0-9-_]+)/);
        if (idParamMatch && idParamMatch[1]) return idParamMatch[1];

        if (/^[a-zA-Z0-9-_]{25,}$/.test(trimmed)) {
          return trimmed;
        }

        return trimmed;
      };

      // ฟังก์ชันดึง API Key อัตโนมัติจาก Google Drive / Docs
      const fetchApiKeyFromGoogleDrive = async () => {
        const fileId = extractDriveFileId(googleDriveUrl);
        if (!fileId) {
          setErrorMessage('กรุณากรอกลิงก์ Google Drive / Google Doc หรือ File ID ที่ถูกต้อง');
          setFetchSuccess(false);
          return;
        }

        setIsFetchingKey(true);
        setErrorMessage('');
        setFetchSuccess(null);

        const endpoints = [
          `https://docs.google.com/document/d/${fileId}/export?format=txt`,
          `https://drive.google.com/uc?export=download&id=${fileId}`
        ];

        let extractedText = '';
        let downloadSuccess = false;

        for (const url of endpoints) {
          try {
            const response = await fetch(url);
            if (response.ok) {
              extractedText = await response.text();
              if (extractedText && extractedText.length > 0) {
                downloadSuccess = true;
                break;
              }
            }
          } catch (err) {}
        }

        if (!downloadSuccess || !extractedText) {
          setErrorMessage('ไม่สามารถดึงข้อมูลได้ โปรดตรวจสอบว่าตั้งค่าแชร์เป็น "ทุกคนที่มีลิงก์อ่านได้" แล้วหรือยัง');
          setFetchSuccess(false);
          setIsFetchingKey(false);
          return;
        }

        const keyMatch = extractedText.match(/AIzaSy[a-zA-Z0-9_-]{33}/);
        const cleanKey = keyMatch ? keyMatch[0] : extractedText.trim().replace(/[\n\r]/g, "");

        if (cleanKey.startsWith('AIzaSy')) {
          setApiKey(cleanKey);
          setFetchSuccess(true);
          const now = new Date().toTimeString().split(' ')[0];
          setLogs(prev => [
            { time: now, message: `🔑 ซิงค์ API Key จาก Google Drive สำเร็จ (เริ่มต้นด้วย ${cleanKey.substring(0, 6)}...)`, type: 'info' },
            ...prev
          ]);
          setTimeout(() => setShowKeyInput(false), 1500);
        } else {
          setErrorMessage('พบข้อมูลแต่โครงสร้างไม่ใช่ Gemini API Key ที่ถูกต้อง (ต้องเริ่มต้นด้วย "AIzaSy")');
          setFetchSuccess(false);
        }
        
        setIsFetchingKey(false);
      };

      // ตัวจับเวลาสำหรับจำลองค่า Real-time
      useEffect(() => {
        if (!isSimulationRunning) return;

        const interval = setInterval(() => {
          setZones(prevZones => {
            const updated = prevZones.map(zone => {
              const change = Math.round((Math.random() - 0.3) * (zone.flowRate / 5));
              let newCount = zone.currentCount + change;
              if (newCount < 0) newCount = 0;
              if (newCount > zone.maxCapacity * 1.1) newCount = Math.round(zone.maxCapacity * 1.1);

              const density = (newCount / zone.maxCapacity) * 100;
              let risk = 'NORMAL';
              if (density >= 80) risk = 'CRITICAL';
              else if (density >= 60) risk = 'WARNING';

              return { ...zone, currentCount: newCount, riskLevel: risk };
            });

            const currentActive = updated.find(z => z.id === selectedZone.id);
            if (currentActive) {
              setSelectedZone(currentActive);
              setChartData(prev => [...prev.slice(-5), currentActive.currentCount]);
            }

            if (Math.random() > 0.7) {
              const randomZone = updated[Math.floor(Math.random() * updated.length)];
              const densityVal = ((randomZone.currentCount / randomZone.maxCapacity) * 100).toFixed(0);
              const now = new Date().toTimeString().split(' ')[0];
              
              let logType = 'info';
              let logMsg = `ตรวจพบความเคลื่อนไหว: ${randomZone.name} มีผู้อยู่ในพื้นที่ ${randomZone.currentCount} คน (${densityVal}%)`;
              
              if (randomZone.riskLevel === 'CRITICAL') {
                logType = 'error';
                logMsg = `🚨 ด่วน! ${randomZone.name} มีอัตราความแน่นเกินพิกัดสีแดง (${densityVal}%)`;
              } else if (randomZone.riskLevel === 'WARNING') {
                logType = 'warning';
                logMsg = `⚠️ แจ้งเตือน: ${randomZone.name} ค่อนข้างหนาแน่น (${densityVal}%)`;
              }

              setLogs(prevLogs => [{ time: now, message: logMsg, type: logType }, ...prevLogs.slice(0, 19)]);
            }

            return updated;
          });
        }, 4000);

        return () => clearInterval(interval);
      }, [isSimulationRunning, selectedZone.id]);

      // ฟังก์ชันเรียกใช้ Gemini 2.5 Flash
      const analyzeWithGemini = async (zone) => {
        if (!apiKey) {
          setErrorMessage('ระบบยังไม่มี API Key กรุณาดำเนินการซิงค์ไฟล์จาก Google Drive');
          return;
        }

        setIsLoadingAi(true);
        setErrorMessage('');

        const densityPercentage = ((zone.currentCount / zone.maxCapacity) * 100).toFixed(1);
        const systemPrompt = "คุณคือวิศวกรผู้เชี่ยวชาญระดับสูงด้านความปลอดภัยและการควบคุมฝูงชน (Crowd Control Safety) สำหรับงานคอนเสิร์ตใหญ่";
        const userQuery = `
          โปรดประเมินสถานการณ์เร่งด่วน:
          - ชื่อโซนจัดงาน: ${zone.name}
          - รายละเอียดสภาพพื้นที่: ${zone.description}
          - ปริมาณผู้เข้าร่วมปัจจุบัน: ${zone.currentCount} คน (ขีดจำกัดสูงสุด: ${zone.maxCapacity} คน)
          - เปอร์เซ็นต์ความหนาแน่น: ${densityPercentage}%
          - พลวัตทิศทางกระแสคน: ${zone.flowRate > 0 ? `ผู้คนกำลังหลั่งไหลเข้ามา +${zone.flowRate} คน/นาที` : `ผู้คนค่อยๆ ไหลออก -${Math.abs(zone.flowRate)} คน/นาที`}
          
          ระดับความเร่งด่วนทางความปลอดภัย: ${zone.riskLevel}

          โปรดส่งคำแนะนำเป็นภาษาไทย สรุปแผนการป้องกันภัย 3 ข้อสั้นๆ โดยเน้นข้อแนะนำที่สตาฟหน้างานปฏิบัติการได้ทันที (เริ่มพิมพ์คำแนะนำข้อ 1 ทันที)`;

        const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;
        
        let delay = 1000;
        let success = false;
        let responseText = '';

        for (let attempt = 1; attempt <= 5; attempt++) {
          try {
            const response = await fetch(url, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                contents: [{ parts: [{ text: userQuery }] }],
                systemInstruction: { parts: [{ text: systemPrompt }] }
              })
            });

            if (response.ok) {
              const result = await response.json();
              responseText = result.candidates?.[0]?.content?.parts?.[0]?.text || "ไม่ได้รับข้อความแนะนำ";
              success = true;
              break;
            } else {
              const errData = await response.json();
              if (errData.error?.message?.includes('API key not valid')) {
                throw new Error('API Key ไม่ถูกต้อง กรุณาตรวจสอบเนื้อหาไฟล์ใน Google Drive ของคุณอีกครั้ง');
              }
            }
          } catch (err) {
            if (attempt === 5 || err.message?.includes('ไม่ถูกต้อง')) {
              setErrorMessage(err.message || 'เกิดข้อผิดพลาดในการเรียกใช้โมเดล AI');
              setIsLoadingAi(false);
              return;
            }
          }
          await new Promise(resolve => setTimeout(resolve, delay));
          delay *= 2;
        }

        if (success) {
          setAiSuggestions(prev => ({ ...prev, [zone.id]: responseText }));
          const now = new Date().toTimeString().split(' ')[0];
          setLogs(prev => [
            { time: now, message: `🤖 AI ออกข้อเสนอเชิงรับมือสำหรับโซน ${zone.name} แล้ว`, type: 'info' },
            ...prev
          ]);
        }
        setIsLoadingAi(false);
      };

      const getRiskStyles = (level) => {
        switch (level) {
          case 'CRITICAL':
            return {
              bg: 'bg-red-950/40 border-rose-500/80',
              text: 'text-rose-400',
              badge: 'bg-rose-500 text-white animate-pulse',
              light: 'shadow-[0_0_15px_rgba(244,63,94,0.5)] border-rose-500',
              dot: 'bg-rose-500'
            };
          case 'WARNING':
            return {
              bg: 'bg-amber-950/30 border-amber-500/60',
              text: 'text-amber-400',
              badge: 'bg-amber-500 text-slate-900',
              light: 'shadow-[0_0_15px_rgba(245,158,11,0.3)] border-amber-500',
              dot: 'bg-amber-500'
            };
          default:
            return {
              bg: 'bg-emerald-950/20 border-emerald-500/40',
              text: 'text-emerald-400',
              badge: 'bg-emerald-500 text-slate-900',
              light: 'border-emerald-500',
              dot: 'bg-emerald-500'
            };
        }
      };

      const selectedStyles = getRiskStyles(selectedZone.riskLevel);

      return (
        <div className="min-h-screen flex flex-col selection:bg-fuchsia-500 selection:text-white">
          {/* HEADER */}
          <header className="border-b border-slate-800 bg-slate-900/80 backdrop-blur sticky top-0 z-40 px-4 py-3 sm:px-6">
            <div className="max-w-7xl mx-auto flex flex-col md:flex-row items-center justify-between gap-4">
              <div className="flex items-center gap-3">
                <div className="w-10 h-10 rounded-xl bg-gradient-to-tr from-violet-600 to-pink-500 flex items-center justify-center shadow-lg shadow-violet-500/20">
                  <svg xmlns="http://www.w3.org/2000/svg" className="h-6 w-6 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                  </svg>
                </div>
                <div>
                  <h1 className="text-xl font-bold bg-gradient-to-r from-violet-400 via-pink-400 to-amber-300 bg-clip-text text-transparent">
                    CrowdSafe AI <span className="text-[10px] bg-slate-800 text-slate-300 px-1.5 py-0.5 rounded ml-1 border border-slate-700">Drive Auto-Sync</span>
                  </h1>
                  <p className="text-xs text-slate-400">ระบบจำลองและวิเคราะห์การระบายผู้เข้าร่วมผ่าน Google Drive Auto Key Sync</p>
                </div>
              </div>

              <div className="flex items-center gap-3 w-full md:w-auto">
                <button
                  onClick={() => setIsSimulationRunning(!isSimulationRunning)}
                  className={`px-3 py-1.5 rounded-lg text-xs font-semibold flex items-center gap-2 transition-all ${
                    isSimulationRunning 
                      ? 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/20' 
                      : 'bg-slate-800 text-slate-400 border border-slate-700'
                  }`}
                >
                  <span className={`w-2.5 h-2.5 rounded-full ${isSimulationRunning ? 'bg-emerald-500 animate-ping' : 'bg-slate-500'}`}></span>
                  {isSimulationRunning ? 'กำลังดึงภาพสด' : 'หยุดดึงภาพ'}
                </button>

                <button
                  onClick={() => setShowKeyInput(!showKeyInput)}
                  className="px-3 py-1.5 rounded-lg text-xs font-semibold bg-slate-800 text-slate-300 hover:bg-slate-700 border border-slate-700 transition-all flex items-center gap-2"
                >
                  <svg xmlns="http://www.w3.org/2000/svg" className="h-4 w-4 text-violet-400" viewBox="0 0 20 20" fill="currentColor">
                    <path d="M10 12a2 2 0 100-4 2 2 0 000 4z" />
                    <path fillRule="evenodd" d="M.458 10C1.732 5.943 5.522 3 10 3s8.268 2.943 9.542 7c-1.274 4.057-5.064 7-9.542 7S1.732 14.057.458 10zM14 10a4 4 0 11-8 0 4 4 0 018 0z" clipRule="evenodd" />
                  </svg>
                  {apiKey ? 'จัดการการเชื่อมต่อ' : 'ตั้งค่า API Key'}
                </button>
              </div>
            </div>
          </header>

          {/* GOOGLE DRIVE / DOCS KEY CONNECTOR */}
          {showKeyInput && (
            <div className="bg-gradient-to-r from-violet-950/40 to-slate-900 border-b border-slate-800 px-4 py-4 sm:px-6">
              <div className="max-w-7xl mx-auto">
                <div className="flex items-center justify-between mb-2">
                  <h3 className="text-xs font-bold text-violet-300 uppercase tracking-widest flex items-center gap-1.5">
                    <svg xmlns="http://www.w3.org/2000/svg" className="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                      <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M7 16a4 4 0 01-.88-7.903A5 5 0 0115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12" />
                    </svg>
                    ระบบดึง API Key อัตโนมัติจาก Google Drive / Docs
                  </h3>
                  <div className="flex gap-2">
                    <button
                      onClick={() => setApiKeySource('drive')}
                      className={`text-[10px] font-bold px-2 py-0.5 rounded ${apiKeySource === 'drive' ? 'bg-violet-600 text-white' : 'bg-slate-800 text-slate-400'}`}
                    >
                      ผ่าน Google Drive / Doc
                    </button>
                    <button
                      onClick={() => setApiKeySource('manual')}
                      className={`text-[10px] font-bold px-2 py-0.5 rounded ${apiKeySource === 'manual' ? 'bg-violet-600 text-white' : 'bg-slate-800 text-slate-400'}`}
                    >
                      ป้อนตรงๆ (Manual)
                    </button>
                  </div>
                </div>

                <p className="text-xs text-slate-400 mb-4 leading-relaxed">
                  นำลิงก์ไฟล์ข้อความ (.txt) จาก <strong className="text-slate-200">Google Drive</strong> หรือลิงก์จาก <strong className="text-slate-200">Google Docs</strong> ที่มีรหัส Gemini API Key มาวาง โดยต้องเปิดสิทธิ์แชร์เป็น 
                  <strong className="text-emerald-400"> "ทุกคนที่มีลิงก์อ่านได้" (Anyone with the link can view)</strong>
                </p>

                <div className="flex flex-col lg:flex-row gap-4 items-stretch lg:items-center">
                  {apiKeySource === 'drive' ? (
                    <div className="flex-1 flex flex-col sm:flex-row gap-2">
                      <input
                        type="text"
                        placeholder="วางลิงก์ Google Drive / Google Doc หรือ File ID (เช่น https://drive.google.com/file/d/1xXyZ...)"
                        value={googleDriveUrl}
                        onChange={(e) => setGoogleDriveUrl(e.target.value)}
                        className="bg-slate-950 border border-violet-500/30 rounded-lg px-3.5 py-2 text-xs text-slate-100 placeholder-slate-600 focus:outline-none focus:ring-2 focus:ring-violet-500 flex-1"
                      />
                      <button
                        onClick={fetchApiKeyFromGoogleDrive}
                        disabled={isFetchingKey}
                        className="bg-gradient-to-r from-violet-600 to-pink-600 hover:from-violet-500 hover:to-pink-500 text-white text-xs font-bold px-5 py-2.5 rounded-lg transition-all shadow-md shadow-violet-500/10 flex items-center justify-center gap-1.5 shrink-0"
                      >
                        {isFetchingKey ? (
                          <>
                            <svg className="animate-spin h-3.5 w-3.5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                              <circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4"></circle>
                              <path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                            </svg>
                            กำลังเชื่อมต่อ...
                          </>
                        ) : (
                          <>
                            <svg xmlns="http://www.w3.org/2000/svg" className="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                              <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
                            </svg>
                            ซิงค์ข้อมูล Key อัตโนมัติ
                          </>
                        )}
                      </button>
                    </div>
                  ) : (
                    <div className="flex-1 flex flex-col sm:flex-row gap-2">
                      <input
                        type="password"
                        placeholder="กรอก Gemini API Key โดยตรงที่นี่..."
                        value={apiKey}
                        onChange={(e) => setApiKey(e.target.value)}
                        className="bg-slate-950 border border-slate-700 rounded-lg px-3.5 py-2 text-xs text-slate-100 placeholder-slate-600 focus:outline-none focus:ring-2 focus:ring-violet-500 flex-1"
                      />
                      <button
                        onClick={() => {
                          if (apiKey) {
                            setFetchSuccess(true);
                            setTimeout(() => setShowKeyInput(false), 1000);
                          } else {
                            setErrorMessage('กรุณาป้อน API Key ก่อนกดตกลง');
                          }
                        }}
                        className="bg-violet-600 hover:bg-violet-500 text-white text-xs font-bold px-5 py-2.5 rounded-lg transition-all"
                      >
                        ใช้คีย์นี้
                      </button>
                    </div>
                  )}

                  {fetchSuccess === true && (
                    <span className="text-emerald-400 text-xs flex items-center gap-1.5 shrink-0 self-center">
                      🟢 เชื่อมต่อคีย์สำเร็จ! พร้อมใช้งาน AI วิเคราะห์เรียลไทม์
                    </span>
                  )}
                </div>

                {errorMessage && (
                  <p className="text-rose-400 text-xs mt-3 flex items-center gap-1.5 font-mono">
                    <span className="w-1.5 h-1.5 rounded-full bg-rose-500 animate-ping"></span>
                    Error: {errorMessage}
                  </p>
                )}
              </div>
            </div>
          )}

          {/* MAIN CONTENT */}
          <main className="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 grid grid-cols-1 lg:grid-cols-12 gap-6">
            
            {/* LEFT COLUMN: Map & Zones */}
            <section className="lg:col-span-7 flex flex-col gap-6">
              
              <div className="bg-slate-900 border border-slate-800 rounded-2xl p-4 overflow-hidden relative shadow-xl">
                <div className="flex items-center justify-between mb-3">
                  <div className="flex items-center gap-2">
                    <span className="w-2.5 h-2.5 rounded-full bg-rose-500 animate-pulse"></span>
                    <span className="text-xs font-bold tracking-wider text-slate-300 uppercase">CCTV FEED / ผังความหนาแน่น 2D</span>
                  </div>
                  <span className="text-[10px] bg-slate-800 px-2 py-0.5 rounded text-slate-400 font-mono">CAM_STAGE_GRID</span>
                </div>

                <div className="relative bg-slate-950 aspect-[16/9] w-full rounded-xl border border-slate-800 overflow-hidden flex items-center justify-center">
                  <div className="absolute inset-0 bg-[linear-gradient(to_right,#1e293b_1px,transparent_1px),linear-gradient(to_bottom,#1e293b_1px,transparent_1px)] bg-[size:3.5rem_3.5rem] opacity-20"></div>
                  
                  <div className="absolute top-2 left-1/2 -translate-x-1/2 w-3/5 h-10 bg-gradient-to-b from-violet-600/60 to-purple-800/20 rounded-b-xl border-x border-b border-violet-500/30 flex items-center justify-center">
                    <span className="text-[10px] font-bold text-violet-300 tracking-widest uppercase">MAIN STAGE (เวทีคอนเสิร์ตหลัก)</span>
                  </div>

                  {zones.map((zone) => {
                    const styles = getRiskStyles(zone.riskLevel);
                    const densityNum = (zone.currentCount / zone.maxCapacity) * 100;
                    
                    return (
                      <button
                        key={zone.id}
                        onClick={() => {
                          setSelectedZone(zone);
                          setChartData([
                            Math.round(zone.currentCount * 0.88),
                            Math.round(zone.currentCount * 0.94),
                            Math.round(zone.currentCount * 1.01),
                            Math.round(zone.currentCount * 0.97),
                            Math.round(zone.currentCount * 0.99),
                            zone.currentCount
                          ]);
                        }}
                        style={{ left: zone.coordinates.x, top: zone.coordinates.y }}
                        className={`absolute -translate-x-1/2 -translate-y-1/2 p-2 rounded-full transition-all duration-300 ${
                          selectedZone.id === zone.id 
                            ? `bg-slate-900 border-2 ${styles.light} z-10 scale-110`
                            : 'bg-slate-900/90 border border-slate-800 hover:border-slate-650'
                        }`}
                      >
                        <span className={`absolute inset-0 rounded-full opacity-35 ${styles.dot} ${densityNum > 80 ? 'animate-ping' : ''}`}></span>
                        <div className="relative flex flex-col items-center">
                          <div className={`w-3 h-3 rounded-full ${styles.dot} mb-1 flex items-center justify-center`}>
                            {zone.riskLevel === 'CRITICAL' && <span className="block w-1 h-1 rounded-full bg-white animate-pulse"></span>}
                          </div>
                          <span className="text-[8px] font-bold text-slate-100 whitespace-nowrap bg-slate-950/90 px-1 py-0.5 rounded">
                            {zone.id.replace('zone-', 'Zone ').toUpperCase()}: {densityNum.toFixed(0)}%
                          </span>
                        </div>
                      </button>
                    );
                  })}

                  <div className="absolute bottom-2 left-6 border border-emerald-500/30 bg-emerald-950/10 px-2 py-0.5 rounded text-[8px] text-emerald-400">
                    🚪 ประตูระบาย 1
                  </div>
                  <div className="absolute bottom-2 right-6 border border-emerald-500/30 bg-emerald-950/10 px-2 py-0.5 rounded text-[8px] text-emerald-400">
                    🚪 ประตูระบาย 2
                  </div>
                </div>
              </div>

              {/* Zone List */}
              <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                {zones.map((zone) => {
                  const styles = getRiskStyles(zone.riskLevel);
                  const densityVal = (zone.currentCount / zone.maxCapacity) * 100;
                  const isSelected = selectedZone.id === zone.id;

                  return (
                    <div
                      key={zone.id}
                      onClick={() => {
                        setSelectedZone(zone);
                        setChartData([
                          Math.round(zone.currentCount * 0.88),
                          Math.round(zone.currentCount * 0.94),
                          Math.round(zone.currentCount * 1.01),
                          Math.round(zone.currentCount * 0.97),
                          Math.round(zone.currentCount * 0.99),
                          zone.currentCount
                        ]);
                      }}
                      className={`rounded-xl border p-4 cursor-pointer transition-all ${
                        isSelected 
                          ? `${styles.bg} border-2 ring-1 ring-offset-2 ring-offset-slate-950 ring-slate-800 shadow-md` 
                          : 'bg-slate-900 border-slate-800 hover:border-slate-700 hover:bg-slate-900/60'
                      }`}
                    >
                      <div className="flex justify-between items-start gap-2 mb-2">
                        <h3 className="text-xs font-bold text-slate-200 line-clamp-1">{zone.name}</h3>
                        <span className={`text-[9px] font-black px-1.5 py-0.5 rounded-full ${styles.badge}`}>
                          {zone.riskLevel}
                        </span>
                      </div>

                      <div className="grid grid-cols-2 gap-2 my-2 text-left">
                        <div>
                          <p className="text-[10px] text-slate-400">ผู้เข้าร่วม</p>
                          <p className="text-base font-bold text-slate-100">
                            {zone.currentCount} <span className="text-xs text-slate-500">/ {zone.maxCapacity}</span>
                          </p>
                        </div>
                        <div>
                          <p className="text-[10px] text-slate-400 font-medium">ความแน่นของพื้นที่</p>
                          <p className={`text-base font-bold ${styles.text}`}>
                            {densityVal.toFixed(0)}%
                          </p>
                        </div>
                      </div>

                      <div className="w-full bg-slate-950 rounded-full h-1.5 mb-2 overflow-hidden border border-slate-800">
                        <div
                          className={`h-full rounded-full transition-all duration-500 ${
                            zone.riskLevel === 'CRITICAL' 
                              ? 'bg-rose-500' 
                              : zone.riskLevel === 'WARNING' 
                                ? 'bg-amber-500' 
                                : 'bg-emerald-500'
                          }`}
                          style={{ width: `${Math.min(densityVal, 100)}%` }}
                        ></div>
                      </div>

                      <div className="flex justify-between items-center text-[10px]">
                        <span className="text-slate-400">
                          ดัชนีการไหล: 
                          <span className={`font-semibold ml-1 ${zone.flowRate > 0 ? 'text-rose-400' : 'text-emerald-400'}`}>
                            {zone.flowRate > 0 ? `+${zone.flowRate}` : zone.flowRate} คน/นาที
                          </span>
                        </span>
                        <span className="text-violet-400 hover:underline flex items-center gap-0.5">
                          ดูรายงานเชิงลึก &rarr;
                        </span>
                      </div>
                    </div>
                  );
                })}
              </div>
            </section>

            {/* RIGHT COLUMN: AI & Details */}
            <section className="lg:col-span-5 flex flex-col gap-6">
              
              <div className={`border rounded-2xl p-5 shadow-xl transition-all ${selectedStyles.bg} relative overflow-hidden`}>
                <div className={`absolute top-0 right-0 w-32 h-32 rounded-full filter blur-[50px] opacity-20 ${selectedStyles.dot}`}></div>
                
                <span className="text-[10px] uppercase font-bold tracking-wider text-slate-400 block mb-1">พื้นที่พิกัดควบคุม</span>
                <h2 className="text-lg font-bold text-slate-100 mb-2">{selectedZone.name}</h2>
                <p className="text-xs text-slate-400 mb-4">{selectedZone.description}</p>

                <div className="grid grid-cols-3 gap-3 mb-4">
                  <div className="bg-slate-950/50 p-2.5 rounded-xl border border-slate-850">
                    <span className="text-[9px] text-slate-400 block">ปริมาณคน</span>
                    <span className="text-base font-black text-slate-100">{selectedZone.currentCount}</span>
                    <span className="text-[9px] text-slate-500 block">/ {selectedZone.maxCapacity}</span>
                  </div>
                  <div className="bg-slate-950/50 p-2.5 rounded-xl border border-slate-850">
                    <span className="text-[9px] text-slate-400 block">ความหนาแน่น</span>
                    <span className={`text-base font-black ${selectedStyles.text}`}>
                      {((selectedZone.currentCount / selectedZone.maxCapacity) * 100).toFixed(0)}%
                    </span>
                    <span className="text-[9px] text-slate-500 block">สัดส่วนพื้นที่</span>
                  </div>
                  <div className="bg-slate-950/50 p-2.5 rounded-xl border border-slate-850">
                    <span className="text-[9px] text-slate-400 block">อัตราเข้า-ออก</span>
                    <span className={`text-base font-black flex items-center justify-center gap-0.5 ${selectedZone.flowRate > 0 ? 'text-rose-400' : 'text-emerald-400'}`}>
                      {selectedZone.flowRate > 0 ? '↑' : '↓'} {Math.abs(selectedZone.flowRate)}
                    </span>
                    <span className="text-[9px] text-slate-500 block">คน/นาที</span>
                  </div>
                </div>

                <div className="mb-4">
                  <span className="text-[10px] text-slate-400 block mb-1.5">กราฟพลวัตประชากรแบบจำลองย้อนหลัง</span>
                  <div className="h-16 flex items-end gap-1.5 bg-slate-950/60 p-2 rounded-lg border border-slate-800">
                    {chartData.map((val, idx) => {
                      const percentHeight = Math.min((val / selectedZone.maxCapacity) * 100, 100);
                      return (
                        <div key={idx} className="flex-1 flex flex-col items-center h-full justify-end">
                          <div 
                            style={{ height: `${percentHeight}%` }} 
                            className={`w-full rounded-t-sm transition-all duration-300 ${
                              selectedZone.riskLevel === 'CRITICAL' ? 'bg-rose-500/70 animate-pulse' : 'bg-violet-500/40'
                            }`}
                          ></div>
                        </div>
                      );
                    })}
                  </div>
                </div>

                {/* AI DECISION SUPPORT */}
                <div className="border-t border-slate-800 pt-4 mt-2">
                  <div className="flex items-center justify-between gap-2 mb-3">
                    <div className="flex items-center gap-2">
                      <div className="w-6 h-6 rounded bg-violet-500/20 border border-violet-500/40 flex items-center justify-center">
                        <span className="text-xs font-bold text-violet-300">AI</span>
                      </div>
                      <span className="text-xs font-bold text-slate-200">มาตรการแก้ไขเร่งด่วน (Gemini Analyst)</span>
                    </div>
                    
                    <button
                      onClick={() => analyzeWithGemini(selectedZone)}
                      disabled={isLoadingAi || !apiKey}
                      className={`px-3 py-1 rounded text-[10px] font-bold flex items-center gap-1.5 transition-all ${
                        !apiKey
                          ? 'bg-slate-800 text-slate-500 cursor-not-allowed border border-slate-700'
                          : 'bg-violet-500/15 text-violet-300 hover:bg-violet-500/25 border border-violet-500/30'
                      }`}
                    >
                      {isLoadingAi ? 'กำลังประมวลผล...' : '⚡ ปรับใช้มาตรการ AI'}
                    </button>
                  </div>

                  <div className="bg-slate-950/90 p-4 rounded-xl border border-slate-800 text-xs min-h-[110px] flex flex-col justify-center leading-relaxed">
                    {!apiKey ? (
                      <div className="text-center text-slate-500 py-3">
                        <p className="mb-2">⚠️ ระบบต้องการ API Key เพื่อทำการประเมินแผนงานอัตโนมัติ</p>
                        <button 
                          onClick={() => setShowKeyInput(true)}
                          className="text-[10px] text-violet-400 underline hover:text-violet-300"
                        >
                          กดที่นี่เพื่อซิงค์ข้อมูล Google Drive / Doc
                        </button>
                      </div>
                    ) : aiSuggestions[selectedZone.id] ? (
                      <div className="whitespace-pre-line text-slate-200 font-mono">
                        {aiSuggestions[selectedZone.id]}
                      </div>
                    ) : (
                      <div className="text-center text-slate-500 py-4">
                        {isLoadingAi ? 'กำลังวิเคราะห์แผนที่ความหนาแน่น...' : 'กดปุ่ม "ปรับใช้มาตรการ AI" ด้านบน เพื่อส่งข้อมูลให้ AI วิเคราะห์'}
                      </div>
                    )}
                  </div>
                </div>
              </div>

              {/* SYSTEM LOGS */}
              <div className="bg-slate-900 border border-slate-800 rounded-2xl p-4 flex-1 flex flex-col min-h-[220px]">
                <div className="flex justify-between items-center mb-3">
                  <span className="text-xs font-bold text-slate-300 uppercase tracking-wide">รายงานข้อผิดพลาดเชิงลึก (Incident logs)</span>
                  <button 
                    onClick={() => setLogs([])}
                    className="text-[9px] text-slate-500 hover:text-slate-300 underline"
                  >
                    ล้างรายการ
                  </button>
                </div>
                
                <div className="bg-slate-950 rounded-xl p-3 border border-slate-850 flex-1 overflow-y-auto max-h-[170px] font-mono text-[10px] space-y-2">
                  {logs.length === 0 ? (
                    <div className="text-center text-slate-600 py-10">ไม่มีข้อบันทึกสถานการณ์ใหม่</div>
                  ) : (
                    logs.map((log, index) => {
                      let badgeColor = 'text-slate-400';
                      if (log.type === 'warning') badgeColor = 'text-amber-400';
                      if (log.type === 'error') badgeColor = 'text-rose-400';

                      return (
                        <div key={index} className="flex gap-2 items-start py-0.5 border-b border-slate-900 last:border-0">
                          <span className="text-slate-500 shrink-0">[{log.time}]</span>
                          <span className={`${badgeColor} leading-normal`}>{log.message}</span>
                        </div>
                      );
                    })
                  )}
                </div>
              </div>

            </section>
          </main>

          <footer className="border-t border-slate-900 bg-slate-950 py-4 text-center text-[10px] text-slate-500 px-4">
            <div className="max-w-7xl mx-auto flex flex-col sm:flex-row justify-between items-center gap-2">
              <p>© 2026 CrowdSafe AI Project - Standalone Single File Edition</p>
              <div className="flex gap-3 text-slate-400 font-mono">
                <span>Google Drive Auto-Sync Active</span>
                <span>•</span>
                <span>Gemini LLM Connected</span>
              </div>
            </div>
          </footer>
        </div>
      );
    }

    const rootElement = document.getElementById('root');
    const root = ReactDOM.createRoot(rootElement);
    root.render(<App />);
  </script>
</body>
</html>
